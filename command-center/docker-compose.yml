# Infinite AI Command Center — the whole platform on one host.
#
#   ./scripts/init-env.sh      # once: writes .env with fresh random secrets
#   docker compose up -d --build
#
# Only the dashboard (8090) and the n8n editor (5680) are published, and only
# on 127.0.0.1 (ports chosen to stay clear of XAMPP and a separate n8n on 5678). PostgreSQL, the API and the worker are reachable from the
# private Docker network alone. Put a TLS reverse proxy in front before
# exposing anything beyond this machine (docs/OPERATIONS.md).

name: infinite-command-center

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DATABASE_URL: postgresql+asyncpg://command_center:${CC_DB_PASSWORD:?run scripts/init-env.sh}@postgres:5432/command_center
  ADMIN_EMAIL: ${ADMIN_EMAIL:?}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
  CC_SERVICE_TOKEN: ${CC_SERVICE_TOKEN:?}
  CC_SECRETS_KEY: ${CC_SECRETS_KEY:?run scripts/init-env (CC_SECRETS_KEY encrypts customer secrets)}
  CREDIT_REPAIR_DATABASE_URL: postgresql+asyncpg://credit_repair:${CREDIT_REPAIR_DB_PASSWORD:?run scripts/init-env}@postgres:5432/credit_repair
  CREDIT_REPAIR_DATA_KEY: ${CREDIT_REPAIR_DATA_KEY:?run scripts/init-env}
  CC_EDITION: ${CC_EDITION:-developer}
  CC_LICENSE_PUBLIC_KEY: ${CC_LICENSE_PUBLIC_KEY:-}
  WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-n8n}
  WORKFLOW_WEBHOOK_URL: ${WORKFLOW_WEBHOOK_URL:-}
  WORKFLOW_WEBHOOK_SECRET: ${WORKFLOW_WEBHOOK_SECRET:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # A second installation on this PC (the JARVIS Brain test copy) sets its own cookie name and a banner label;
  # these defaults keep this installation as it was.
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cc_session}
  CC_INSTANCE_LABEL: ${CC_INSTANCE_LABEL:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
  LLM_EFFORT: ${LLM_EFFORT:-low}
  LLM_DAILY_REQUEST_CAP: ${LLM_DAILY_REQUEST_CAP:-200}
  N8N_BASE_URL: http://n8n:5678
  N8N_EDITOR_URL: ${N8N_EDITOR_URL:-http://localhost:${N8N_PORT:-5680}}
  N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?}
  N8N_API_KEY: ${N8N_API_KEY:-}
  MONITOR_ALLOWED_PRIVATE_HOSTS: ${MONITOR_ALLOWED_PRIVATE_HOSTS:-}
  MONITOR_CONTROL_URLS: ${MONITOR_CONTROL_URLS:-}
  WP_CORE_VERSION_CHECK: ${WP_CORE_VERSION_CHECK:-true}
  TZ: ${TZ:-America/New_York}

services:
  postgres:
    image: ${REGISTRY:-docker.io}/library/postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
    volumes:
      # PostgreSQL 18 layout: the volume holds /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # One-shot, every start: creates missing roles and databases (also on upgrades).
  db-init:
    image: ${REGISTRY:-docker.io}/library/postgres:18.6-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CC_DB_PASSWORD: ${CC_DB_PASSWORD:?}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?}
      CREDIT_REPAIR_DB_PASSWORD: ${CREDIT_REPAIR_DB_PASSWORD:?run scripts/init-env}
    volumes:
      - ./postgres/provision.sh:/provision.sh:ro
    # The image declares VOLUME /var/lib/postgresql. db-init writes nothing there (provision.sh runs psql against
    # postgres), and without this Docker would give each new container an anonymous volume, which Compose then hands
    # on to every recreated one, so "down --volumes" never removes it.
    tmpfs:
      - /var/lib/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: ./backend
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        # Set by the install and start scripts from the VERSION file; the build checks the copied code against it.
        APP_VERSION: ${CC_RELEASE_VERSION:-}
      secrets: [extra_ca]
    image: infinite-command-center/backend:local
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [internal]

  worker:
    # Same image the api service builds; never pulled from a registry.
    image: infinite-command-center/backend:local
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    # Time for running tasks (e.g. a server operation) to finish on stop; longer
    # repairs are reported as interrupted when the worker is back.
    stop_grace_period: 2m
    environment: *api-env
    volumes:
      # Optional owner content, e.g. templates/proposal-template.html
      - ./templates:/app/templates:ro
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, egress]

  dashboard:
    build:
      context: ./dashboard
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        APP_VERSION: ${CC_RELEASE_VERSION:-}
      secrets: [extra_ca]
    image: infinite-command-center/dashboard:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8090}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, edge]

  n8n:
    image: ${REGISTRY:-docker.io}/n8nio/n8n:2.43.7
    restart: unless-stopped
    entrypoint: ["tini", "--", "/bin/sh", "/opt/cc/entrypoint.sh"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:?}
      N8N_INSTANCE_OWNER_EMAIL: ${ADMIN_EMAIL:?}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME:-Infinite}
      N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME:-Marketing}
      CC_SERVICE_TOKEN: ${CC_SERVICE_TOKEN:?}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_PUBLIC_URL:-http://localhost:${N8N_PORT:-5680}/}
      GENERIC_TIMEZONE: ${TZ:-America/New_York}
      TZ: ${TZ:-America/New_York}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/entrypoint.sh:/opt/cc/entrypoint.sh:ro
      - ./n8n/provision-credentials.mjs:/opt/cc/provision-credentials.mjs:ro
      - ./n8n/workflows:/opt/cc/workflows:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5680}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [internal, egress]

networks:
  # No route out: PostgreSQL and the dashboard live only here.
  internal:
    internal: true
  # Outbound internet for the monitors, the model API and n8n.
  egress: {}
  # Carries the dashboard's published port (internal networks cannot publish).
  edge: {}

secrets:
  # Empty by default; set EXTRA_CA_BUNDLE only behind a TLS-intercepting proxy.
  extra_ca:
    file: ${EXTRA_CA_BUNDLE:-./scripts/empty-ca-bundle.pem}

volumes:
  pgdata:
  n8n_data:
