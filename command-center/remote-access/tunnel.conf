# Remote access through Cloudflare Tunnel: a second, separate listener in the
# dashboard container. Used only when docker-compose.tunnel.yml is enabled (see
# docs/REMOTE_ACCESS_PLAN.md); the local 127.0.0.1:8090 site (default.conf) is
# unchanged. Port 8081 is never published to the PC: only the cloudflared
# container on the private "tunnel" network can reach it.

# Any hostname this file does not name: close the connection without an answer.
server {
    listen 8081 default_server;
    server_name _;
    return 444;
}

# https://command.infinitemarketingai.com: the dashboard, behind Cloudflare Access.
server {
    listen 8081;
    server_name command.infinitemarketingai.com;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    # The visitor's address. Only cloudflared (fixed address in docker-compose.tunnel.yml)
    # may state it; from any other peer the header is ignored and the peer address is used.
    set_real_ip_from 172.29.37.10;
    real_ip_header CF-Connecting-IP;

    # cloudflared already refuses requests without a valid Access token (access.required in
    # the tunnel's public hostname settings). This is a second, cheaper check.
    if ($http_cf_access_jwt_assertion = "") {
        return 403;
    }

    # Every location below repeats these, because a location with its own add_header
    # inherits none from here. HSTS for this hostname only, short, no includeSubDomains:
    # the live website and other subdomains are not affected.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API must not see addresses the visitor made up.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 60s;
        # The session cookie only travels over HTTPS on this hostname (also covers logout's delete).
        proxy_cookie_flags cc_session secure;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        try_files $uri /index.html;
    }
}

# hooks.infinitemarketingai.com is not served yet: the messaging gateway is planned
# for 0.6.0 (docs/REMOTE_ACCESS_PLAN.md, "Webhooks"). Until then the hostname has no
# DNS record and no tunnel route, and the default server above refuses it.
