<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0a1626"/>
      <stop offset="55%" stop-color="#060b16"/>
      <stop offset="100%" stop-color="#02060e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfe9ff" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#35c6ff" stop-opacity="0.55"/>
      <stop offset="62%" stop-color="#35c6ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#35c6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#bfe9ff"/>
      <stop offset="100%" stop-color="#35c6ff"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <!-- faint grid -->
    <g stroke="#35c6ff" stroke-opacity="0.05" stroke-width="2">
      <path d="M100 306h824M100 512h824M100 718h824M306 100v824M512 100v824M718 100v824"/>
    </g>
    <!-- reactor glow -->
    <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
    <!-- outer ring -->
    <circle cx="512" cy="512" r="252" fill="none" stroke="#1d4a6e" stroke-width="10"/>
    <circle cx="512" cy="512" r="238" fill="none" stroke="#35c6ff" stroke-opacity="0.5" stroke-width="4"/>
    <!-- coil segments -->
    <g fill="#35c6ff">
      <g id="coil">
        <rect x="494" y="296" width="36" height="88" rx="10"/>
      </g>
      <use href="#coil" transform="rotate(36 512 512)"/>
      <use href="#coil" transform="rotate(72 512 512)"/>
      <use href="#coil" transform="rotate(108 512 512)"/>
      <use href="#coil" transform="rotate(144 512 512)"/>
      <use href="#coil" transform="rotate(180 512 512)"/>
      <use href="#coil" transform="rotate(216 512 512)"/>
      <use href="#coil" transform="rotate(252 512 512)"/>
      <use href="#coil" transform="rotate(288 512 512)"/>
      <use href="#coil" transform="rotate(324 512 512)"/>
    </g>
    <!-- inner ring -->
    <circle cx="512" cy="512" r="176" fill="none" stroke="#12304a" stroke-width="14"/>
    <circle cx="512" cy="512" r="176" fill="none" stroke="#35c6ff" stroke-opacity="0.65" stroke-width="5"/>
    <!-- core -->
    <circle cx="512" cy="512" r="118" fill="url(#core)"/>
    <circle cx="512" cy="512" r="118" fill="none" stroke="#bfe9ff" stroke-opacity="0.8" stroke-width="6"/>
    <!-- panel edge highlight -->
    <rect x="106" y="106" width="812" height="812" rx="180" fill="none" stroke="#1d4a6e" stroke-width="6"/>
  </g>
</svg>
