<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS HUD</title>
    <style>
      :root {
        color-scheme: dark;
        --void: #02060e;
        --bg: #07090f;
        --panel: rgba(6, 17, 32, 0.78);
        --panel-2: rgba(8, 24, 39, 0.72);
        --line: #12304a;
        --line-bright: #1d4a6e;
        --cyan: #35c6ff;
        --teal: #35ffd5;
        --ice: #bfe9ff;
        --white: #f3f8ff;
        --dim: #5f88a8;
        --muted: #365b75;
        --gold: #ffb64d;
        --red: #ff5d73;
        --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
        --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --top-h: 52px;
        --chat-h: 286px;
        --gutter: 28px;
        background: var(--void);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        background: var(--void);
        color: var(--ice);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 90% 70% at 50% 42%, rgba(53, 198, 255, 0.09), transparent 58%),
          radial-gradient(ellipse 80% 80% at 50% 120%, rgba(53, 255, 213, 0.045), transparent 55%),
          repeating-linear-gradient(0deg, transparent 0 47px, rgba(53, 198, 255, 0.045) 47px 48px),
          repeating-linear-gradient(90deg, transparent 0 47px, rgba(53, 198, 255, 0.045) 47px 48px),
          linear-gradient(180deg, #040812 0%, #02060e 100%);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
        mix-blend-mode: overlay;
        opacity: 0.36;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      :focus-visible {
        outline: 1px solid var(--cyan);
        outline-offset: 3px;
      }

      .topbar {
        position: fixed;
        z-index: 30;
        top: 0;
        left: 0;
        right: 0;
        height: var(--top-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 var(--gutter);
        border-bottom: 1px solid var(--line);
        background: rgba(2, 6, 14, 0.86);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .brand,
      .top-right,
      .connection {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand {
        color: var(--white);
        letter-spacing: 0.32em;
        white-space: nowrap;
      }

      .brand-dot {
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 10px var(--cyan);
        animation: blink 2.4s ease-in-out infinite;
      }

      .connection {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: var(--cyan);
        font-size: 11px;
        letter-spacing: 0.18em;
      }

      .connection.offline {
        color: var(--gold);
      }

      .top-right {
        justify-content: flex-end;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.14em;
        white-space: nowrap;
      }

      .badge {
        color: var(--dim);
      }

      .badge.hot {
        color: var(--gold);
        text-shadow: 0 0 12px rgba(255, 182, 77, 0.42);
      }

      .demo-badge {
        color: var(--gold);
        border: 1px solid var(--gold);
        border-radius: 3px;
        padding: 3px 8px;
        text-shadow: 0 0 12px rgba(255, 182, 77, 0.42);
      }

      .demo-badge[hidden] {
        display: none;
      }

      .clock {
        color: var(--cyan);
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(6, 17, 32, 0.72);
        cursor: pointer;
      }

      .icon-btn:hover {
        border-color: var(--cyan);
        color: var(--cyan);
        box-shadow: 0 0 16px rgba(53, 198, 255, 0.18);
      }

      .icon-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }

      .corner {
        position: fixed;
        z-index: 31;
        width: 20px;
        height: 20px;
        pointer-events: none;
        border-color: var(--line-bright);
      }

      .corner.tl {
        top: calc(var(--top-h) + 8px);
        left: 8px;
        border-top: 1px solid;
        border-left: 1px solid;
      }

      .corner.tr {
        top: calc(var(--top-h) + 8px);
        right: 8px;
        border-top: 1px solid;
        border-right: 1px solid;
      }

      .corner.bl {
        bottom: 8px;
        left: 8px;
        border-bottom: 1px solid;
        border-left: 1px solid;
      }

      .corner.br {
        right: 8px;
        bottom: 8px;
        border-right: 1px solid;
        border-bottom: 1px solid;
      }

      .hud-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(250px, 330px) minmax(440px, 1fr) minmax(330px, 470px);
        gap: 26px;
        height: 100vh;
        padding: calc(var(--top-h) + 26px) var(--gutter) 28px;
      }

      .left-column,
      .right-column {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 28px;
        flex: 0 0 auto;
        margin-bottom: 12px;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.24em;
        white-space: nowrap;
      }

      .section-label b {
        color: var(--cyan);
        font-weight: 400;
      }

      .section-label::after {
        content: "";
        height: 1px;
        flex: 1;
        background: linear-gradient(90deg, var(--line), transparent);
      }

      .agents {
        display: grid;
        grid-template-rows: repeat(6, minmax(min-content, 1fr));
        gap: 10px;
        min-height: 0;
        flex: 1;
        overflow-y: auto;
      }

      /* Shown only while a fresh install has nothing to report; it disappears
         for good the moment a real signal arrives, so it never costs the
         panels permanent height. */
      .agents-hint {
        margin: 0 0 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(53, 198, 255, 0.05);
        color: var(--dim);
        font-size: 11px;
        line-height: 1.45;
        letter-spacing: 0.02em;
      }

      .agents-hint[hidden] {
        display: none;
      }

      .agent {
        position: relative;
        min-height: 0;
        padding: 14px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(53, 198, 255, 0.06), transparent 44%),
          var(--panel);
      }

      .agent::before {
        content: "";
        position: absolute;
        top: 13px;
        left: 13px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--teal);
        box-shadow: 0 0 12px currentColor;
      }

      .agent-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-left: 18px;
      }

      .agent h2 {
        margin: 0;
        color: var(--white);
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.18em;
      }

      .agent-status {
        color: var(--teal);
        font-size: 10px;
        letter-spacing: 0.12em;
      }

      .agent p {
        display: -webkit-box;
        min-height: 38px;
        margin: 12px 0 10px;
        overflow: hidden;
        color: var(--ice);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.45;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .agent time {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.16em;
      }

      .agent.status-working {
        border-color: rgba(53, 198, 255, 0.55);
        box-shadow: inset 0 0 28px rgba(53, 198, 255, 0.05);
      }

      .agent.status-working::before {
        color: var(--cyan);
        background: var(--cyan);
        animation: blink 1.1s ease-in-out infinite;
      }

      .agent.status-waiting_approval {
        border-color: rgba(255, 182, 77, 0.58);
      }

      .agent.status-waiting_approval::before,
      .agent.status-waiting_approval .agent-status {
        color: var(--gold);
        background: var(--gold);
      }

      .agent.status-waiting_approval .agent-status {
        background: transparent;
      }

      .agent.status-offline {
        opacity: 0.58;
      }

      .agent.status-offline::before,
      .agent.status-offline .agent-status {
        color: var(--muted);
        background: var(--muted);
      }

      .agent.status-offline .agent-status {
        background: transparent;
      }

      .agent {
        cursor: pointer;
      }

      .agent:hover,
      .agent.selected {
        border-color: rgba(53, 198, 255, 0.62);
      }

      .agent.selected {
        box-shadow: 0 0 24px rgba(53, 198, 255, 0.14);
      }

      .reactor-panel {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto auto;
        align-items: center;
        justify-items: center;
        padding: 18px 18px 22px;
      }

      .reactor-stage {
        position: relative;
        width: min(62vh, 680px);
        max-width: 100%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      #reactor {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #reactor[data-reactor-fallback] {
        border-radius: 50%;
        background: radial-gradient(circle, rgba(234, 247, 255, 0.9) 0%, rgba(53, 198, 255, 0.5) 12%, rgba(53, 198, 255, 0.12) 42%, transparent 72%);
      }

      .reactor-frame {
        position: absolute;
        inset: 7%;
        pointer-events: none;
        border: 1px solid rgba(53, 198, 255, 0.16);
        border-radius: 50%;
      }

      .reactor-frame::before,
      .reactor-frame::after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }

      .reactor-frame::before {
        inset: -5%;
        border: 1px dashed rgba(53, 198, 255, 0.22);
        animation: spin 60s linear infinite;
      }

      .reactor-frame::after {
        inset: 23%;
        border: 1px solid rgba(53, 198, 255, 0.11);
        box-shadow: inset 0 0 34px rgba(53, 198, 255, 0.08);
      }

      .mrr-block {
        width: min(680px, 100%);
        text-align: center;
      }

      .progress-label {
        color: var(--gold);
        font-size: 12px;
        letter-spacing: 0.28em;
      }

      .mrr {
        margin-top: 4px;
        color: var(--white);
        font-size: 64px;
        font-weight: 500;
        line-height: 1;
        text-shadow:
          0 0 24px rgba(53, 198, 255, 0.28),
          0 0 54px rgba(53, 198, 255, 0.14);
      }

      .metrics {
        width: min(680px, 100%);
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 22px;
      }

      .metric {
        min-width: 0;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(6, 17, 32, 0.54);
      }

      .metric span {
        display: block;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.18em;
      }

      .metric strong {
        display: block;
        margin-top: 5px;
        overflow: hidden;
        color: var(--ice);
        font-size: 18px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .activity {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding-right: 4px;
      }

      .activity::-webkit-scrollbar,
      .agents::-webkit-scrollbar,
      .chat-log::-webkit-scrollbar {
        width: 7px;
      }

      .activity::-webkit-scrollbar-thumb,
      .agents::-webkit-scrollbar-thumb,
      .chat-log::-webkit-scrollbar-thumb {
        border-radius: 8px;
        background: rgba(53, 198, 255, 0.18);
      }

      .activity-item {
        position: relative;
        margin-bottom: 10px;
        padding: 12px 13px 13px;
        border: 1px solid rgba(18, 48, 74, 0.92);
        border-radius: 8px;
        background: var(--panel-2);
      }

      .activity-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 2px;
        background: var(--cyan);
        opacity: 0.7;
      }

      .activity-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--cyan);
        font-size: 10px;
        letter-spacing: 0.18em;
      }

      .activity-meta time {
        color: var(--muted);
      }

      .activity-item p {
        margin: 9px 0 0;
        color: var(--ice);
        font-family: var(--sans);
        font-size: 13px;
      }

      .role-bobby::before,
      .role-bobby .activity-meta,
      .role-ava::before,
      .role-ava .activity-meta {
        color: var(--gold);
        background: var(--gold);
      }

      .role-bobby .activity-meta,
      .role-ava .activity-meta {
        background: transparent;
      }

      .brief-card {
        flex: 0 0 auto;
        margin-top: 16px;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(6, 17, 32, 0.68);
      }

      .brief-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .brief-head h2 {
        margin: 0;
        color: var(--white);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.2em;
      }

      .brief-date {
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.14em;
      }

      .brief-card p {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        color: var(--ice);
        font-family: var(--sans);
        font-size: 13px;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 5;
      }

      .brief-card button:disabled {
        cursor: default;
        opacity: 0.36;
      }

      .chat {
        position: fixed;
        z-index: 32;
        left: var(--gutter);
        right: var(--gutter);
        bottom: 18px;
        height: var(--chat-h);
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr) 50px;
        border: 1px solid var(--line-bright);
        border-radius: 8px;
        background: rgba(2, 6, 14, 0.92);
        box-shadow: 0 -10px 44px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transform: translateY(0);
        transition: transform 220ms ease;
      }

      .chat.collapsed {
        transform: translateY(calc(100% - 40px));
      }

      .chat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 0 10px 0 16px;
        border-bottom: 1px solid var(--line);
      }

      .chat-title {
        color: var(--cyan);
        font-size: 11px;
        letter-spacing: 0.2em;
      }

      .chat-log {
        min-height: 0;
        overflow: auto;
        padding: 14px 16px;
      }

      .chat-bubble {
        width: fit-content;
        max-width: min(760px, 78%);
        margin: 0 0 10px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ice);
        background: rgba(8, 24, 39, 0.82);
        font-family: var(--sans);
        white-space: pre-wrap;
      }

      .chat-bubble.user {
        margin-left: auto;
        border-color: rgba(53, 198, 255, 0.42);
        background: rgba(53, 198, 255, 0.12);
      }

      .chat-bubble.assistant {
        border-color: rgba(255, 182, 77, 0.28);
      }

      .chat-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 42px;
        gap: 10px;
        padding: 8px 10px 10px 16px;
        border-top: 1px solid var(--line);
      }

      .chat-form input,
      .settings-form input {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(6, 17, 32, 0.75);
        color: var(--white);
      }

      .chat-form input {
        height: 34px;
        padding: 0 12px;
      }

      .chat-form input::placeholder {
        color: var(--muted);
      }

      .chat-form button:disabled {
        opacity: 0.5;
      }

      /* Lane C (voice) */
      .chat-form.has-voice {
        grid-template-columns: 42px minmax(0, 1fr) 42px;
      }

      .voice-state {
        padding: 6px 16px 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .voice-state.listening {
        color: #35c6ff;
      }

      .voice-state.error {
        color: #ffb64d;
        text-transform: none;
        letter-spacing: 0;
      }

      #voice-mic.active {
        border-color: #35c6ff;
        box-shadow: 0 0 0 1px rgba(53, 198, 255, 0.6);
      }

      .brief-status {
        display: inline-block;
        margin-right: 8px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        vertical-align: middle;
      }

      .brief-status.error {
        color: #ffb64d;
      }

      .voice-detail {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
        text-transform: none;
        letter-spacing: 0;
      }
      /* end Lane C */

      .history {
        position: fixed;
        z-index: 34;
        top: var(--top-h);
        right: 0;
        bottom: 0;
        width: min(560px, 94vw);
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        visibility: hidden;
        border-left: 1px solid var(--line-bright);
        background: rgba(2, 6, 14, 0.96);
        box-shadow: -18px 0 60px rgba(0, 0, 0, 0.52);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transform: translateX(100%);
        transition:
          transform 240ms ease,
          visibility 0s linear 240ms;
      }

      .history.open {
        visibility: visible;
        transform: translateX(0);
        transition: transform 240ms ease;
      }

      .history::before,
      .history::after {
        content: "";
        position: absolute;
        left: 8px;
        width: 16px;
        height: 16px;
        pointer-events: none;
        border-color: var(--line-bright);
      }

      .history::before {
        top: 8px;
        border-top: 1px solid;
        border-left: 1px solid;
      }

      .history::after {
        bottom: 8px;
        border-bottom: 1px solid;
        border-left: 1px solid;
      }

      .history-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        padding: 16px 16px 13px 26px;
        border-bottom: 1px solid var(--line);
      }

      .history-kicker {
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.24em;
      }

      .history-head h2 {
        margin: 5px 0 0;
        color: var(--white);
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.2em;
      }

      .history-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 34px;
        padding: 8px 16px 8px 26px;
        border-bottom: 1px solid var(--line);
      }

      .history-subtitle {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .history-back {
        height: 28px;
        flex: 0 0 auto;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(6, 17, 32, 0.82);
        color: var(--cyan);
        font-size: 10px;
        letter-spacing: 0.18em;
        cursor: pointer;
      }

      .history-back:hover {
        border-color: var(--cyan);
      }

      .history-body {
        min-height: 0;
        overflow: auto;
        padding: 14px 16px 24px 26px;
      }

      .history-body::-webkit-scrollbar {
        width: 7px;
      }

      .history-body::-webkit-scrollbar-thumb {
        border-radius: 8px;
        background: rgba(53, 198, 255, 0.18);
      }

      .session {
        position: relative;
        width: 100%;
        display: block;
        margin-bottom: 10px;
        padding: 12px 13px 13px;
        overflow: hidden;
        border: 1px solid rgba(18, 48, 74, 0.92);
        border-radius: 8px;
        background: var(--panel-2);
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .session:hover {
        border-color: rgba(53, 198, 255, 0.5);
        box-shadow: 0 0 18px rgba(53, 198, 255, 0.08);
      }

      .session::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 2px;
        background: var(--cyan);
        opacity: 0.7;
      }

      .session-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--cyan);
        font-size: 10px;
        letter-spacing: 0.18em;
      }

      .session-meta .when {
        color: var(--muted);
      }

      .session-title {
        display: block;
        margin-top: 9px;
        color: var(--ice);
        font-family: var(--sans);
        font-size: 13px;
      }

      .session-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-top: 9px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.14em;
      }

      .session-stats .delegated {
        color: var(--gold);
      }

      .session-stats .lineage {
        color: var(--dim);
      }

      .session.load-more {
        color: var(--cyan);
        font-size: 10px;
        letter-spacing: 0.22em;
        text-align: center;
      }

      .session.load-more::before {
        display: none;
      }

      .session.load-more:disabled {
        color: var(--dim);
        cursor: default;
      }

      .msg-truncated {
        color: var(--gold);
        opacity: 0.7;
      }

      .transcript-msg {
        margin: 0 0 13px;
      }

      .msg-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 5px;
        color: var(--cyan);
        font-size: 10px;
        letter-spacing: 0.18em;
      }

      .msg-meta time {
        color: var(--muted);
      }

      .transcript-msg.assistant .msg-meta {
        color: var(--gold);
      }

      .transcript-msg .chat-bubble {
        max-width: 100%;
        font-size: 13px;
      }

      .transcript-msg.user .chat-bubble {
        margin-left: 0;
      }

      .output {
        margin: 0 0 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(2, 6, 14, 0.62);
      }

      .output summary {
        padding: 9px 12px;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.22em;
        cursor: pointer;
      }

      .output .cmd {
        padding: 0 12px 8px;
        color: var(--cyan);
        font-size: 12px;
        user-select: all;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .output pre {
        max-height: 320px;
        margin: 0;
        padding: 0 12px 12px;
        overflow: auto;
        color: var(--muted);
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .history-note {
        margin: 20px 4px;
        color: var(--dim);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.55;
      }

      .history-note b {
        display: block;
        margin-bottom: 7px;
        color: var(--cyan);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.22em;
      }

      .history-note.loading b {
        animation: blink 1.2s ease-in-out infinite;
      }

      dialog {
        width: min(520px, calc(100vw - 44px));
        padding: 0;
        border: 1px solid var(--line-bright);
        border-radius: 8px;
        background: rgba(3, 8, 16, 0.98);
        color: var(--ice);
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.55);
      }

      dialog::backdrop {
        background: rgba(0, 0, 0, 0.62);
        backdrop-filter: blur(2px);
      }

      .settings-form {
        padding: 20px;
      }

      #approval-dialog {
        padding: 20px;
        overflow-wrap: anywhere;
      }

      #approval-agent { font-size: 15px; letter-spacing: 0.16em; }
      #approval-cwd { color: var(--dim); font-size: 12px; }
      #approval-dialog pre {
        max-height: 40vh;
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--line-bright);
        white-space: pre-wrap;
      }

      .settings-form h2 {
        margin: 0 0 18px;
        color: var(--white);
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.22em;
      }

      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 14px;
      }

      .field[hidden] {
        display: none;
      }

      .field label,
      .field .field-label,
      .toggle span {
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.16em;
      }

      #support-code {
        color: var(--cyan);
        font-weight: 600;
        letter-spacing: 0.2em;
      }

      .settings-form input[type="password"],
      .settings-form input[type="number"] {
        height: 38px;
        padding: 0 11px;
      }

      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 38px;
        margin-bottom: 10px;
      }

      .toggle input {
        width: 44px;
        height: 24px;
        accent-color: var(--cyan);
      }

      .settings-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }

      .text-btn {
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(6, 17, 32, 0.82);
        color: var(--ice);
        cursor: pointer;
      }

      .text-btn.primary {
        border-color: var(--cyan);
        background: rgba(53, 198, 255, 0.14);
        color: var(--cyan);
      }

      .cursor-hidden,
      .cursor-hidden * {
        cursor: none !important;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.28;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 1180px) {
        body {
          overflow: auto;
        }

        .hud-grid {
          height: auto;
          min-height: 100vh;
          grid-template-columns: 1fr;
          padding-bottom: 88px;
        }

        .agents {
          grid-template-rows: none;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .reactor-stage {
          width: min(78vw, 560px);
        }

        .activity {
          max-height: 420px;
        }
      }

      @media (max-width: 700px) {
        :root {
          --gutter: 14px;
        }

        .connection {
          display: none;
        }

        .brand {
          letter-spacing: 0.16em;
        }

        .top-right {
          gap: 8px;
          font-size: 10px;
        }

        .agents,
        .metrics {
          grid-template-columns: 1fr;
        }

        .mrr {
          font-size: 42px;
        }

        .chat {
          height: 70vh;
        }
      }

      /* ====================================================================
         ARRIVAL — the HUD side of the birth (TRANSITION-DESIGN.md §8).
         Applied ONLY when the page arrives with ?born=full: without the
         .arrival class nothing here matches, so a normal launch is
         byte-for-byte today's boot. The renderer removes the class on the
         last panel's animationend (or a 1.6s failsafe), and any input jumps
         everything to its end state via .arrival-done.
         ==================================================================== */

      body.arrival .left-column,
      body.arrival .reactor-panel,
      body.arrival .right-column,
      body.arrival .chat {
        opacity: 0;
        animation: hud-holoIn 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }

      body.arrival .reactor-panel { animation-delay: 0s; }
      body.arrival .left-column { animation-delay: 0.12s; }
      body.arrival .right-column { animation-delay: 0.24s; }
      body.arrival .chat { animation-delay: 0.36s; }

      body.arrival .topbar,
      body.arrival .corner {
        opacity: 0;
        animation: hud-fadeIn 0.3s ease forwards;
      }

      body.arrival.arrival-done .left-column,
      body.arrival.arrival-done .reactor-panel,
      body.arrival.arrival-done .right-column,
      body.arrival.arrival-done .chat,
      body.arrival.arrival-done .topbar,
      body.arrival.arrival-done .corner {
        animation: none;
        opacity: 1;
      }

      @keyframes hud-holoIn {
        0% { opacity: 0; transform: translateY(20px) scale(0.99); filter: brightness(2.1) saturate(0.4); }
        45% { opacity: 1; }
        70% { filter: brightness(1.35) saturate(0.9); }
        100% { opacity: 1; transform: none; filter: none; }
      }

      @keyframes hud-fadeIn {
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        body.arrival .left-column,
        body.arrival .reactor-panel,
        body.arrival .right-column,
        body.arrival .chat,
        body.arrival .topbar,
        body.arrival .corner {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>J.A.R.V.I.S.</span></div>
      <div id="connection" class="connection">CONNECTING</div>
      <div class="top-right">
        <span id="demo-badge" class="badge demo-badge" hidden>DEMO &mdash; SAMPLE DATA</span>
        <span id="approvals" class="badge">NO APPROVALS</span>
        <span id="brief-countdown">BRIEF --</span>
        <time id="clock" class="clock">--:--:--</time>
        <button id="settings-open" class="icon-btn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2.05 2.05 0 0 1-2.9 2.9l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .15 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1-.15 1.7 1.7 0 0 0-1.88.34l-.06.06a2.05 2.05 0 0 1-2.9-2.9l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.15-1 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0 .15-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2.05 2.05 0 0 1 2.9-2.9l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.15 1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1 .15 1.7 1.7 0 0 0 1.88-.34l.06-.06a2.05 2.05 0 0 1 2.9 2.9l-.06.06A1.7 1.7 0 0 0 19.4 9c.17.32.17.68 0 1a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <main class="hud-grid">
      <section class="left-column" aria-label="Agents">
        <div class="section-label"><b>01</b><span>AGENTS</span></div>
        <p id="agents-hint" class="agents-hint" role="status" hidden></p>
        <div id="agents" class="agents"></div>
      </section>

      <section class="reactor-panel" aria-label="Revenue">
        <div class="reactor-stage">
          <canvas id="reactor"></canvas>
          <div class="reactor-frame"></div>
        </div>
        <div class="mrr-block">
          <div id="progress-label" class="progress-label">0% TO TARGET</div>
          <div id="mrr" class="mrr">$0</div>
        </div>
        <div class="metrics">
          <div class="metric"><span>TODAY</span><strong id="today">$0</strong></div>
          <div class="metric"><span>ARR</span><strong id="arr">$0</strong></div>
          <div class="metric"><span>TARGET</span><strong id="target">$0</strong></div>
        </div>
      </section>

      <aside class="right-column" aria-label="Activity">
        <div class="section-label"><b>02</b><span>ACTIVITY</span></div>
        <div id="activity" class="activity"></div>
        <section class="brief-card" aria-label="Daily brief">
          <div class="brief-head">
            <div>
              <h2>DAILY BRIEF</h2>
              <div id="brief-date" class="brief-date">NO BRIEF</div>
            </div>
            <span id="brief-status" class="brief-status" role="status" aria-live="polite" hidden></span>
            <button id="brief-play" class="icon-btn" type="button" aria-label="Play brief" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 5v14l11-7-11-7Z"></path>
              </svg>
            </button>
          </div>
          <p id="brief-text">Awaiting daily brief.</p>
        </section>
      </aside>
    </main>

    <aside id="history" class="history" aria-label="Agent history" aria-hidden="true">
      <header class="history-head">
        <div>
          <div class="history-kicker">SESSION HISTORY</div>
          <h2 id="history-agent">AGENT</h2>
        </div>
        <button id="history-close" class="icon-btn" type="button" aria-label="Close history">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 6l12 12"></path>
            <path d="M18 6L6 18"></path>
          </svg>
        </button>
      </header>
      <div class="history-nav">
        <button id="history-back" class="history-back" type="button" hidden>&lt; SESSIONS</button>
        <div id="history-subtitle" class="history-subtitle"></div>
      </div>
      <div id="history-body" class="history-body"></div>
    </aside>

    <section id="chat" class="chat collapsed" aria-label="Chat">
      <div class="chat-head">
        <div class="chat-title">HERMES AGENT</div>
        <button id="chat-toggle" class="icon-btn" type="button" aria-label="Toggle chat" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </button>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <!-- Lane C (voice): state line sits above the input so the listening /
           listening / transcribing state is never ambiguous, and every failure has
           somewhere honest to appear. -->
      <button id="voice-stop" class="text-btn" type="button" aria-label="Stop speaking" hidden>STOP VOICE</button>
      <div id="voice-state" class="voice-state" role="status" aria-live="polite" hidden></div>
      <form id="chat-form" class="chat-form">
        <button id="voice-mic" class="icon-btn" type="button" aria-label="Hold to talk" title="Hold to talk (or hold Space)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"></path>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
            <path d="M12 18v4"></path>
          </svg>
        </button>
        <input id="chat-input" name="message" autocomplete="off" placeholder="Local command" />
        <button id="chat-send" class="icon-btn" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2L11 13"></path>
            <path d="M22 2l-7 20-4-9-9-4 20-7Z"></path>
          </svg>
        </button>
      </form>
    </section>

    <dialog id="approval-dialog" aria-labelledby="approval-agent" aria-describedby="approval-summary">
      <h2 id="approval-agent"></h2>
      <p id="approval-summary"></p>
      <pre><code id="approval-command"></code></pre>
      <p id="approval-cwd"></p>
      <div class="settings-actions">
        <button id="approval-deny" class="text-btn" type="button" autofocus>DENY</button>
        <button id="approval-approve" class="text-btn primary" type="button">APPROVE</button>
      </div>
    </dialog>

    <dialog id="settings-dialog">
      <form id="settings-form" class="settings-form" method="dialog">
        <h2>HUD SETTINGS</h2>
        <div class="field">
          <label for="api-key">ENGINE KEY (THIS SESSION)</label>
          <input id="api-key" type="password" autocomplete="off" readonly />
        </div>
        <div class="field">
          <label for="gateway-port">ENGINE PORT (THIS SESSION)</label>
          <input id="gateway-port" type="number" readonly />
        </div>
        <label class="toggle">
          <span>START JARVIS WHEN I SIGN IN</span>
          <input id="start-at-login" type="checkbox" />
        </label>
        <label class="toggle">
          <span>DEMO MODE (SAMPLE DATA ONLY)</span>
          <input id="demo-mode" type="checkbox" />
        </label>
        <label class="toggle">
          <span>KIOSK</span>
          <input id="kiosk-mode" type="checkbox" />
        </label>
        <!-- Lane C (voice) -->
        <label class="toggle">
          <span>SPEAK REPLIES ALOUD</span>
          <input id="speak-replies" type="checkbox" checked />
        </label>
        <div class="field" id="voice-field">
          <span class="field-label">VOICE <b id="voice-voice-id">…</b></span>
          <span id="voice-detail" class="voice-detail">…</span>
        </div>
        <!-- end Lane C -->
        <div class="field">
          <label for="rerun-setup">SETUP</label>
          <button id="rerun-setup" class="text-btn" type="button">RUN SETUP AGAIN</button>
        </div>
        <div class="field">
          <label for="connect-slack">SLACK</label>
          <button id="connect-slack" class="text-btn" type="button">CONNECT SLACK</button>
        </div>
        <div class="field" id="support-field">
          <span class="field-label">SUPPORT CODE <b id="support-code">…</b></span>
          <button id="copy-diagnostics" class="text-btn" type="button" aria-live="polite">COPY DIAGNOSTICS</button>
        </div>
        <div class="field" id="version-field">
          <span class="field-label">VERSION <b id="app-version">…</b></span>
        </div>
        <div class="settings-actions">
          <button id="settings-cancel" class="text-btn" type="button">CANCEL</button>
          <button class="text-btn primary" type="submit">SAVE</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="../dist/renderer.js"></script>
  </body>
</html>
